name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check · Lint · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
      NEXTAUTH_SECRET: ci-secret-placeholder-do-not-use-in-prod-ci-secret-placeholder
      NEXTAUTH_URL: http://localhost:3000
      WILDCARD_DOMAIN: .localhost:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit de dependencias (bloquea solo criticals)
        run: pnpm audit --prod --audit-level critical

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Push schema to CI database
        run: pnpm prisma db push --skip-generate

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build

      # Gate de deploy: si se configura el secret COOLIFY_DEPLOY_WEBHOOK (y se
      # desactiva el auto-deploy on-push en Coolify), el deploy solo ocurre con
      # el CI en verde. Sin el secret este paso es un no-op y Coolify sigue
      # desplegando por push, como hasta ahora.
      - name: Deploy a Coolify (solo main, si hay webhook configurado)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK" ]; then
            echo "COOLIFY_DEPLOY_WEBHOOK no configurado — Coolify sigue en auto-deploy por push."
            exit 0
          fi
          curl -fsSL -X POST "$COOLIFY_DEPLOY_WEBHOOK" \
            ${COOLIFY_API_TOKEN:+-H "Authorization: Bearer $COOLIFY_API_TOKEN"}
          echo "Deploy disparado tras CI verde."
